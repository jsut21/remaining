[package]
name = "remaining"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
authors = ["jsut21"]
description = "A small CLI and GNOME panel indicator for AI usage quotas."
license = "MIT"
repository = "https://github.com/jsut21/remaining"
homepage = "https://github.com/jsut21/remaining"
readme = "README.md"
keywords = ["ai", "usage", "quota", "gnome", "cli"]
categories = ["command-line-utilities"]
exclude = ["/.github/**", "/designs/*.pen", "/designs/export*/**", "/designs/review/**"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
console = "0.15"
regex-lite = "0.1"
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

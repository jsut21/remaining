name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq libglib2.0-bin shellcheck
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package
        run: cargo package --locked
      - name: Desktop integration checks
        run: |
          bash -n desktop/gnome/install.sh desktop/gnome/uninstall.sh desktop/waybar/remaining-waybar.sh
          shellcheck desktop/gnome/install.sh desktop/gnome/uninstall.sh desktop/waybar/remaining-waybar.sh
          node --check desktop/gnome/remaining@jsut21.github.io/extension.js
          glib-compile-schemas --strict --dry-run desktop/gnome/remaining@jsut21.github.io/schemas
          jq empty desktop/gnome/remaining@jsut21.github.io/metadata.json schemas/remaining.schema.json
